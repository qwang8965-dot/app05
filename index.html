<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- 禁用雙擊縮放與模擬原生 App 視口 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>我們這一家 | Atashin'chi 角色圖鑑</title>

  <!-- PWA 必要 Meta 標籤 -->
  <meta id="meta-theme-color" name="theme-color" content="#F4A261" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="我們這一家圖鑑" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="我們這一家（Atashin'chi）角色圖鑑展示 PWA 應用程式" />

  <!-- 動態掛載的 Manifest 與 Apple Touch Icon 佔位符 -->
  <link id="pwa-manifest" rel="manifest" href="" />
  <link id="apple-touch-icon" rel="apple-touch-icon" href="" />

  <!-- 引入 Tailwind CSS 與 Google Fonts (Noto Sans TC & Zen Maru Gothic) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            rounded: ['"Zen Maru Gothic"', '"Noto Sans TC"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --bg-from: #FFF1E6;
      --bg-via: #FDE2D2;
      --bg-to: #F8C8B0;
      --accent-primary: #E76F51;
      --accent-secondary: #F4A261;
      --accent-soft: rgba(231, 111, 81, 0.14);
      --accent-border: rgba(231, 111, 81, 0.28);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overscroll-behavior-y: none;
      user-select: none;
      -webkit-user-select: none;
      background-color: #EAE6E1;
    }

    /* 背景動態漸層平滑過渡 */
    .app-canvas {
      background: linear-gradient(155deg, var(--bg-from) 0%, var(--bg-via) 52%, var(--bg-to) 100%);
      transition: background 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 桌面端手機外框模擬 */
    @media (min-width: 640px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: radial-gradient(circle at 20% 20%, #f5f2ed 0%, #dcd6ce 100%);
      }
      .device-frame {
        height: min(860px, 94vh);
        border-radius: 3rem;
        box-shadow:
          0 25px 60px -15px rgba(30, 25, 20, 0.25),
          0 0 0 10px #ffffff,
          0 0 0 11px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }
    }

    @media (max-width: 639px) {
      .device-frame {
        height: 100dvh;
        border-radius: 0;
      }
    }

    /* 安全區域留白 */
    .safe-top {
      padding-top: max(1rem, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }

    /* 隱藏捲軸但保留流暢滾動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 玻璃擬態卡片 */
    .glass-card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 30px -8px rgba(31, 38, 135, 0.07);
    }

    /* 角色切換淡入與滑動動畫 */
    @keyframes slideInRight {
      0% {
        opacity: 0;
        transform: translateX(26px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes slideInLeft {
      0% {
        opacity: 0;
        transform: translateX(-26px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .anim-slide-right {
      animation: slideInRight 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .anim-slide-left {
      animation: slideInLeft 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .avatar-float {
      animation: floatSlow 3.8s ease-in-out infinite;
    }

    /* 動態主題強調色工具類別 */
    .theme-text {
      color: var(--accent-primary);
      transition: color 0.45s ease;
    }
    .theme-bg {
      background-color: var(--accent-primary);
      transition: background-color 0.45s ease;
    }
    .theme-bg-soft {
      background-color: var(--accent-soft);
      transition: background-color 0.45s ease;
    }
    .theme-border {
      border-color: var(--accent-border);
      transition: border-color 0.45s ease;
    }
    .theme-gradient-badge {
      background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
      transition: background 0.45s ease;
    }
  </style>
</head>
<body>

  <!-- 手機外框 / 滿版容器 -->
  <main id="app-shell" class="device-frame app-canvas relative w-full max-w-md mx-auto flex flex-col overflow-hidden text-slate-800">

    <!-- 1. 頂部標題列 (Header) -->
    <header class="safe-top px-5 pb-2.5 flex items-center justify-between z-20 shrink-0">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full theme-bg shadow-sm"></span>
          <h1 class="font-rounded text-xl font-black tracking-tight text-slate-800">我們這一家</h1>
        </div>
        <p class="text-[11px] font-semibold tracking-wider uppercase text-slate-500/90 mt-0.5">
          Atashin'chi Character Guide
        </p>
      </div>

      <!-- 右側功能按鈕：音效開關 & 安裝 App 提示 -->
      <div class="flex items-center gap-2">
        <button
          id="btn-sound"
          type="button"
          aria-label="切換按鍵音效"
          class="w-9 h-9 rounded-full glass-card flex items-center justify-center text-slate-700 active:scale-90 transition-transform shadow-sm"
          title="音效開關"
        >
          <!-- 音效開啟 SVG -->
          <svg id="icon-sound-on" class="w-4 h-4 theme-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <!-- 音效靜音 SVG -->
          <svg id="icon-sound-off" class="w-4 h-4 text-slate-400 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <button
          id="btn-install"
          type="button"
          class="px-3 py-1.5 rounded-full glass-card flex items-center gap-1.5 text-xs font-bold text-slate-700 active:scale-95 transition-transform shadow-sm"
        >
          <svg class="w-3.5 h-3.5 theme-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>安裝 App</span>
        </button>
      </div>
    </header>

    <!-- 2. 角色切換導覽列 (Segmented Control / Pills) -->
    <nav class="px-5 py-2 z-20 shrink-0" aria-label="角色選擇">
      <div class="relative grid grid-cols-4 p-1.5 rounded-2xl bg-white/60 backdrop-blur-md border border-white/80 shadow-inner">
        <!-- 動態膠囊高亮背景 (Active Pill) -->
        <div
          id="nav-pill"
          class="absolute top-1.5 bottom-1.5 left-1.5 w-[calc(25%-3px)] rounded-xl theme-gradient-badge shadow-md transition-transform duration-300 ease-out"
        ></div>

        <button type="button" data-index="0" class="nav-btn relative z-10 py-2 text-xs font-extrabold rounded-xl transition-all duration-300 text-white scale-105">
          花媽
        </button>
        <button type="button" data-index="1" class="nav-btn relative z-10 py-2 text-xs font-bold rounded-xl transition-all duration-300 text-slate-600">
          花爸
        </button>
        <button type="button" data-index="2" class="nav-btn relative z-10 py-2 text-xs font-bold rounded-xl transition-all duration-300 text-slate-600">
          橘子
        </button>
        <button type="button" data-index="3" class="nav-btn relative z-10 py-2 text-xs font-bold rounded-xl transition-all duration-300 text-slate-600">
          柚子
        </button>
      </div>
    </nav>

    <!-- 3. 主要滑動內容區 (支援 Touch Swipe 左右切換) -->
    <div id="swipe-area" class="flex-1 overflow-y-auto no-scrollbar px-5 pt-2 safe-bottom">
      <div id="character-stage" class="space-y-4 pb-4">

        <!-- 角色視覺展示卡片 (Hero Card) -->
        <section class="glass-card rounded-3xl p-5 relative overflow-hidden">
          <!-- 裝飾性背景光暈 -->
          <div class="absolute -top-12 -right-12 w-36 h-36 rounded-full theme-bg-soft blur-2xl pointer-events-none"></div>
          <div class="absolute -bottom-10 -left-10 w-32 h-32 rounded-full theme-bg-soft blur-xl pointer-events-none"></div>

          <!-- 頂部小徽章與滑動提示 -->
          <div class="flex items-center justify-between mb-2 relative z-10">
            <span id="hero-role-badge" class="px-3 py-1 rounded-full text-[11px] font-bold tracking-wide theme-bg-soft theme-text border theme-border">
              一家之主（實質）
            </span>
            <span class="text-[11px] font-medium text-slate-400 flex items-center gap-1">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8L22 12L18 16"></path>
                <path d="M6 8L2 12L6 16"></path>
                <line x1="2" y1="12" x2="22" y2="12"></line>
              </svg>
              左右滑動切換
            </span>
          </div>

          <!-- 中央角色專屬自繪向量 SVG 插畫 -->
          <div class="my-2 flex justify-center items-center relative z-10">
            <div id="hero-avatar-container" class="w-44 h-44 rounded-3xl flex items-center justify-center shadow-inner border-2 border-white/90 avatar-float overflow-hidden">
              <!-- 由 JS 動態注入精緻 SVG -->
            </div>
          </div>

          <!-- 圖片下方疊加角色名稱與日文原名標籤 -->
          <div class="text-center mt-3 relative z-10">
            <div class="inline-flex items-baseline gap-2 justify-center flex-wrap">
              <h2 id="hero-name" class="font-rounded text-2xl font-black text-slate-800 tracking-tight">
                花媽
              </h2>
              <span id="hero-alias" class="text-xs font-bold text-slate-500">
                （花太太／花師奶）
              </span>
            </div>
            <div class="mt-1.5 flex justify-center">
              <span id="hero-jp-name" class="px-3.5 py-0.5 rounded-full bg-white/90 border border-slate-200/80 text-xs font-bold tracking-widest text-slate-600 shadow-xs">
                母（立花 翠 / Tachibana Midori）
              </span>
            </div>
          </div>
        </section>

        <!-- 角色詳細檔案區 (Profile Details)：分為三個質感資訊區塊 -->

        <!-- 區塊一：基本資料與背景（標籤式呈現） -->
        <section class="glass-card rounded-3xl p-4 space-y-3">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-xl theme-bg-soft flex items-center justify-center theme-text">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <h3 class="font-rounded text-sm font-extrabold text-slate-800">基本資料與背景</h3>
          </div>

          <div id="profile-tags" class="flex flex-wrap gap-2">
            <!-- 標籤動態生成 -->
          </div>
          <p id="profile-background" class="text-xs leading-relaxed text-slate-600 bg-white/60 rounded-2xl p-3 border border-white">
            <!-- 背景描述動態生成 -->
          </p>
        </section>

        <!-- 區塊二：性格特徵（重點關鍵字高亮） -->
        <section class="glass-card rounded-3xl p-4 space-y-2.5">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-xl theme-bg-soft flex items-center justify-center theme-text">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </div>
            <h3 class="font-rounded text-sm font-extrabold text-slate-800">性格特徵</h3>
          </div>

          <p id="profile-personality" class="text-[13px] leading-6 text-slate-700 font-normal">
            <!-- 含關鍵字高亮之性格描述 -->
          </p>
        </section>

        <!-- 區塊三：經典名言 / 招牌動作（引用卡片樣式） -->
        <section class="glass-card rounded-3xl p-4 space-y-2.5 relative overflow-hidden">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-xl theme-bg-soft flex items-center justify-center theme-text">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            </div>
            <h3 class="font-rounded text-sm font-extrabold text-slate-800">經典名言 / 招牌動作</h3>
          </div>

          <blockquote class="relative rounded-2xl p-3.5 theme-bg-soft border-l-4 theme-border">
            <span class="absolute top-1 right-3 font-serif text-4xl opacity-20 theme-text font-black">”</span>
            <ul id="profile-signatures" class="space-y-1.5 text-xs font-bold text-slate-800 relative z-10">
              <!-- 招牌特色項目 -->
            </ul>
          </blockquote>
        </section>

        <!-- 底部頁面指示器與快捷切換 -->
        <div class="flex items-center justify-between pt-1 px-1">
          <button id="btn-prev" type="button" class="px-3.5 py-2 rounded-2xl glass-card text-xs font-bold text-slate-600 flex items-center gap-1 active:scale-95 transition-transform">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            上一位
          </button>

          <div id="dots-indicator" class="flex items-center gap-2">
            <span class="w-5 h-2 rounded-full theme-bg transition-all duration-300"></span>
            <span class="w-2 h-2 rounded-full bg-slate-400/40 transition-all duration-300"></span>
            <span class="w-2 h-2 rounded-full bg-slate-400/40 transition-all duration-300"></span>
            <span class="w-2 h-2 rounded-full bg-slate-400/40 transition-all duration-300"></span>
          </div>

          <button id="btn-next" type="button" class="px-3.5 py-2 rounded-2xl glass-card text-xs font-bold text-slate-600 flex items-center gap-1 active:scale-95 transition-transform">
            下一位
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

      </div>
    </div>

    <!-- 自訂 PWA 安裝說明提示框 (取代 alert，符合原生質感) -->
    <div id="install-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-xs p-4">
      <div class="w-full max-w-sm bg-white rounded-3xl p-5 shadow-2xl border border-slate-100 transform transition-all">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-2xl theme-gradient-badge flex items-center justify-center text-white font-rounded font-black text-lg shadow-md">
              花
            </div>
            <div>
              <h4 class="font-rounded font-extrabold text-slate-800 text-base">安裝「我們這一家圖鑑」</h4>
              <p class="text-[11px] text-slate-500">Progressive Web App 離線版</p>
            </div>
          </div>
          <button id="btn-close-modal" type="button" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">
            ✕
          </button>
        </div>

        <p id="install-modal-desc" class="text-xs text-slate-600 leading-relaxed mb-4">
          將此圖鑑加入手機主畫面，即可享受全螢幕原生 App 體驗，並在無網路狀態下隨時瀏覽花家成員資料！
        </p>

        <div class="bg-slate-50 rounded-2xl p-3 space-y-2 text-xs text-slate-700 mb-4 border border-slate-100">
          <div class="flex items-start gap-2">
            <span class="font-bold theme-text">iOS Safari：</span>
            <span>點擊底部「分享」圖示，選擇「加入主畫面」。</span>
          </div>
          <div class="flex items-start gap-2">
            <span class="font-bold theme-text">Android / Chrome：</span>
            <span>點擊瀏覽器右上角選單，選擇「安裝應用程式」。</span>
          </div>
        </div>

        <div class="flex gap-2">
          <button id="btn-trigger-prompt" type="button" class="hidden flex-1 py-2.5 rounded-2xl theme-gradient-badge text-white text-xs font-bold shadow-md active:scale-95 transition-transform">
            立即安裝到桌面
          </button>
          <button id="btn-modal-ok" type="button" class="flex-1 py-2.5 rounded-2xl bg-slate-800 text-white text-xs font-bold active:scale-95 transition-transform">
            我知道了
          </button>
        </div>
      </div>
    </div>

  </main>

  <script>
    /**
     * ============================================================================
     * 1. 角色完整資料庫與專屬主題色彩、自繪向量 SVG 插畫
     * ============================================================================
     */
    const CHARACTERS = [
      {
        id: 'mom',
        navLabel: '花媽',
        name: '花媽',
        alias: '（花太太／花師奶）',
        jpName: '母（立花 翠 / Tachibana Midori）',
        roleBadge: '一家之主（實質）',
        theme: {
          bgFrom: '#FFF0E5',
          bgVia: '#FFD8BE',
          bgTo: '#F4A261',
          primary: '#E76F51',
          secondary: '#F4A261',
          soft: 'rgba(231, 111, 81, 0.14)',
          border: 'rgba(231, 111, 81, 0.32)',
          avatarBg: 'linear-gradient(145deg, #FFEDE0 0%, #F9C5A2 100%)'
        },
        tags: ['生於日本九州', '全職家庭主婦', '省錢達人', '大嗓門'],
        background: '生於日本九州，全職家庭主婦。每天為了家計精打細算，是花家大小事務的靈魂人物與氣氛核心。',
        personality: '個性<mark class="px-1.5 py-0.5 rounded-md bg-[#E76F51]/15 text-[#C84B2C] font-bold">熱情、嗓門大、說話直接</mark>，極度固執且<mark class="px-1.5 py-0.5 rounded-md bg-[#E76F51]/15 text-[#C84B2C] font-bold">愛貪小便宜</mark>。秉持「<mark class="px-1.5 py-0.5 rounded-md bg-[#E76F51]/15 text-[#C84B2C] font-bold">能省則省</mark>」的原則，常把剩菜變成新菜、把舊物發揮到極致，對雞毛蒜皮的小事非常執著，經常與橘子、柚子鬥嘴，但內心十分<mark class="px-1.5 py-0.5 rounded-md bg-[#E76F51]/15 text-[#C84B2C] font-bold">在意與包容花爸</mark>。',
        signatures: [
          '🎵 高歌「情熱の赤いバラ（熱情的紅玫瑰）」的震撼歌聲',
          '💰 驚人的省錢執念與超市特價雷達',
          '👄 標誌性的厚嘴唇與半月型大頭輪廓'

    const SoundEngine = {

      ctx: null,
      init() {
        if (!this.ctx) {

          if (AudioContext) {

          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {

        }

      playBubble(pitchMultiplier = 1) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          // 清脆氣泡頻率上揚曲線
          osc.type = 'sine';
          const baseFreq = 420 * pitchMultiplier;
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.85, now + 0.085);

          // 柔和包絡避免爆音
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.1);

          // 忽略瀏覽器自動播放限制錯誤

    const characterStage = document.getElementById('character-stage');
    const heroRoleBadge = document.getElementById('hero-role-badge');
    const heroAvatarContainer = document.getElementById('hero-avatar-container');
    const heroName = document.getElementById('hero-name');
    const heroAlias = document.getElementById('hero-alias');
    const heroJpName = document.getElementById('hero-jp-name');
    const profileTags = document.getElementById('profile-tags');
    const profileBackground = document.getElementById('profile-background');
    const profilePersonality = document.getElementById('profile-personality');
    const profileSignatures = document.getElementById('profile-signatures');
    const dotsIndicator = document.getElementById('dots-indicator').children;

    function renderCharacter(index, direction = 'right') {
      const char = CHARACTERS[index];
      if (!char) return;

      // 1. 更新 CSS 主題變數（背景漸層與強調色平滑過渡）
      rootStyle.setProperty('--bg-from', char.theme.bgFrom);
      rootStyle.setProperty('--bg-via', char.theme.bgVia);
      rootStyle.setProperty('--bg-to', char.theme.bgTo);
      rootStyle.setProperty('--accent-primary', char.theme.primary);
      rootStyle.setProperty('--accent-secondary', char.theme.secondary);
      rootStyle.setProperty('--accent-soft', char.theme.soft);
      rootStyle.setProperty('--accent-border', char.theme.border);

      // 2. 動態更新 PWA 狀態列 theme-color
      if (metaThemeColor) {
        metaThemeColor.setAttribute('content', char.theme.secondary);
      }

      // 3. 更新 Segmented Control 膠囊位置與文字狀態
      navPill.style.transform = `translateX(${index * 100}%)`;
      navButtons.forEach((btn, idx) => {
        if (idx === index) {
          btn.classList.remove('text-slate-600', 'font-bold');
          btn.classList.add('text-white', 'font-extrabold', 'scale-105');
        } else {
          btn.classList.remove('text-white', 'font-extrabold', 'scale-105');
          btn.classList.add('text-slate-600', 'font-bold');
        }
      });

      // 4. 更新底部圓點指示器
      Array.from(dotsIndicator).forEach((dot, idx) => {
        if (idx === index) {
          dot.className = 'w-5 h-2 rounded-full theme-bg transition-all duration-300';
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-slate-400/40 transition-all duration-300';
        }
      });

      // 5. 觸發內容區淡入與微幅滑動動畫
      characterStage.classList.remove('anim-slide-right', 'anim-slide-left');
      void characterStage.offsetWidth; // 強制 reflow 重新觸發動畫
      characterStage.classList.add(direction === 'left' ? 'anim-slide-left' : 'anim-slide-right');

      // 6. 填入角色視覺與檔案資料
      heroRoleBadge.textContent = char.roleBadge;
      heroAvatarContainer.style.background = char.theme.avatarBg;
      heroAvatarContainer.innerHTML = char.svg;
      heroName.textContent = char.name;
      heroAlias.textContent = char.alias;
      heroJpName.textContent = char.jpName;

      // 標籤式基本資料
      profileTags.innerHTML = char.tags
        .map(
          (tag) =>
            `<span class="px-2.5 py-1 rounded-xl text-xs font-bold theme-bg-soft theme-text border theme-border"># ${tag}</span>`
        )
        .join('');

      profileBackground.textContent = char.background;
      profilePersonality.innerHTML = char.personality;
      profileSignatures.innerHTML = char.signatures
        .map((item) => `<li class="leading-relaxed">${item}</li>`)
        .join('');

      // 7. 記住使用者當前瀏覽角色
      try {
        localStorage.setItem(STORAGE_KEY, String(index));
      } catch (e) {}
    }

    function switchCharacter(newIndex, direction) {
      const total = CHARACTERS.length;
      const normalized = (newIndex + total) % total;
      if (normalized === currentIndex) return;

      const autoDir = direction || (normalized > currentIndex ? 'right' : 'left');
      currentIndex = normalized;

      // 依角色給予略微不同的清脆音高
      const pitches = [1.0, 0.88, 1.15, 1.08];
      SoundEngine.playBubble(pitches[currentIndex]);
      renderCharacter(currentIndex, autoDir);
    }

    // 導覽列按鈕點擊事件
    navButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const targetIdx = parseInt(btn.dataset.index, 10);
        switchCharacter(targetIdx);
      });
    });

    // 上一位 / 下一位按鈕
    document.getElementById('btn-prev').addEventListener('click', () => {
      switchCharacter(currentIndex - 1, 'left');
    });
    document.getElementById('btn-next').addEventListener('click', () => {
      switchCharacter(currentIndex + 1, 'right');
    });

    // 鍵盤左右方向鍵支援（桌面測試更順手）
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') switchCharacter(currentIndex - 1, 'left');
      if (e.key === 'ArrowRight') switchCharacter(currentIndex + 1, 'right');
    });

    /**
     * ============================================================================
     * 4. 原生手感左右滑動手勢偵測 (Touch Swipe)
     * ============================================================================
     */
    const swipeArea = document.getElementById('swipe-area');
    let touchStartX = 0;
    let touchStartY = 0;

    swipeArea.addEventListener(
      'touchstart',
      (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      },
      { passive: true }
    );

    swipeArea.addEventListener(
      'touchend',
      (e) => {
        if (e.changedTouches.length === 1) {
          const deltaX = e.changedTouches[0].clientX - touchStartX;
          const deltaY = e.changedTouches[0].clientY - touchStartY;

          // 確保為水平滑動而非垂直捲動，且滑動距離超過 45px
          if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3) {
            if (deltaX < 0) {
              // 向左滑 -> 下一位
              switchCharacter(currentIndex + 1, 'right');
            } else {
              // 向右滑 -> 上一位
              switchCharacter(currentIndex - 1, 'left');
            }
          }
        }
      },
      { passive: true }
    );

    /**
     * ============================================================================
     * 5. 音效開關與 PWA 安裝提示互動
     * ============================================================================
     */
    const btnSound = document.getElementById('btn-sound');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');

    btnSound.addEventListener('click', () => {
      SoundEngine.enabled = !SoundEngine.enabled;
      if (SoundEngine.enabled) {
        iconSoundOn.classList.remove('hidden');
        iconSoundOff.classList.add('hidden');
        SoundEngine.playBubble(1.25);
      } else {
        iconSoundOn.classList.add('hidden');
        iconSoundOff.classList.remove('hidden');
      }
    });

    // 攔截瀏覽器原生 PWA 安裝事件 (beforeinstallprompt)
    let deferredPrompt = null;
    const installModal = document.getElementById('install-modal');
    const btnTriggerPrompt = document.getElementById('btn-trigger-prompt');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnTriggerPrompt.classList.remove('hidden');
    });

    document.getElementById('btn-install').addEventListener('click', () => {
      SoundEngine.playBubble(1.1);
      installModal.classList.remove('hidden');
      installModal.classList.add('flex');
    });

    const closeModal = () => {
      installModal.classList.add('hidden');
      installModal.classList.remove('flex');
    };

    document.getElementById('btn-close-modal').addEventListener('click', closeModal);
    document.getElementById('btn-modal-ok').addEventListener('click', closeModal);
    installModal.addEventListener('click', (e) => {
      if (e.target === installModal) closeModal();
    });

    btnTriggerPrompt.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      btnTriggerPrompt.classList.add('hidden');
      closeModal();
    });

    /**
     * ============================================================================
     * 6. 單檔自包含 PWA 架構：動態生成 SVG App Icon、Manifest 與 Service Worker
     * ============================================================================
     */
    (function setupSingleFilePWA() {
      try {
        // 1. 自動生成高質感花媽主題 SVG App Icon (512x512)
        const appIconSvg = `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F4A261"/>
                <stop offset="100%" stop-color="#E76F51"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="115" fill="url(#iconBg)"/>
            <circle cx="256" cy="268" r="158" fill="#FFE0C8" stroke="#5A3825" stroke-width="12"/>
            <path d="M126 218 C142 120, 370 120, 386 218 C355 190, 315 205, 290 182 C265 205, 225 205, 200 182 C175 205, 145 190, 126 218 Z" fill="#3D2B24"/>
            <circle cx="204" cy="248" r="13" fill="#2A1C17"/>
            <circle cx="308" cy="248" r="13" fill="#2A1C17"/>
            <path d="M188 326 C215 298, 297 298, 324 326 C300 336, 212 336, 188 326 Z" fill="#E76F51" stroke="#5A3825" stroke-width="9"/>
            <path d="M188 330 C215 362, 297 362, 324 330 C300 344, 212 344, 188 330 Z" fill="#E76F51" stroke="#5A3825" stroke-width="9"/>
          </svg>
        `.trim();

        const iconDataUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(appIconSvg);
        const appleIconLink = document.getElementById('apple-touch-icon');
        if (appleIconLink) appleIconLink.href = iconDataUri;

        // 2. 動態生成 Web App Manifest Data URI
        const manifestData = {
          name: '我們這一家角色圖鑑 | Atashin\'chi Guide',
          short_name: '我們這一家',
          description: '具備原生 Mobile App 體驗的《我們這一家》角色圖鑑展示應用程式',
          start_url: window.location.href,
          display: 'standalone',
          orientation: 'portrait',
          background_color: '#FFF1E6',
          theme_color: '#F4A261',
          icons: [
            {
              src: iconDataUri,
              sizes: '192x192 512x512',
              type: 'image/svg+xml',
              purpose: 'any maskable'
            }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const manifestLink = document.getElementById('pwa-manifest');
        if (manifestLink) manifestLink.href = manifestUrl;

        // 3. 透過 Blob URL 註冊離線快取 Service Worker
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
          const swCode = `
            const CACHE_NAME = 'atashinchi-guide-v1';
            self.addEventListener('install', (event) => {
              self.skipWaiting();
              event.waitUntil(
                caches.open(CACHE_NAME).then((cache) => {
                  return cache.addAll([self.location.origin + self.location.pathname]).catch(() => {});
                })
              );
            });
            self.addEventListener('activate', (event) => {
              event.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (event) => {
              if (event.request.method !== 'GET') return;
              event.respondWith(
                caches.match(event.request).then((cached) => {
                  const networked = fetch(event.request)
                    .then((res) => {
                      if (res && res.status === 200) {
                        const clone = res.clone();
                        caches.open(CACHE_NAME).then((c) => c.put(event.request, clone));
                      }
                      return res;
                    })
                    .catch(() => cached);
                  return cached || networked;
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        }
      } catch (err) {
        // 單檔預覽環境下容錯處理
      }
    })();

    // 初始化渲染記憶的角色畫面
    renderCharacter(currentIndex, 'right');
  </script>
</body>
</html>
